services:
  redis:
    image: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - yt-downloader-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight:/data
    networks:
      - yt-downloader-network

volumes:
  redisinsight:

networks:
  yt-downloader-network:
